name: Agent Reality toolchain bootstrap
on:
  push:
    branches: [feat/agent-reality-api-pnpm-bun-vitest]
    paths: [.github/workflows/agent-reality-toolchain.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Resolve and pin development dependencies
        shell: bash
        run: |
          mkdir -p /tmp/reality-toolchain/project /tmp/reality-toolchain/tools
          cd /tmp/reality-toolchain/project
          printf '%s\n' '{"name":"agent-reality-api","version":"0.2.0","private":true,"type":"module","packageManager":"pnpm@11.21.0"}' > package.json
          pnpm add --save-dev --save-exact vitest @modelcontextprotocol/sdk
          { node --version; pnpm --version; bun --version; pnpm exec vitest --version; } > versions.txt
          cp "$(command -v bun)" /tmp/reality-toolchain/tools/bun
          cp -a "$(dirname "$(dirname "$(realpath "$(command -v pnpm)")")")" /tmp/reality-toolchain/tools/pnpm
          cd /tmp/reality-toolchain
          tar -czf /tmp/reality-toolchain.tgz project tools
      - uses: actions/upload-artifact@v4
        with:
          name: reality-toolchain
          path: /tmp/reality-toolchain.tgz
          retention-days: 1
          compression-level: 0
